name: Test and publish
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: riemann-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/math.test.mjs
      - run: node --check app.mjs
      - run: npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
      - name: Locate preinstalled Chrome
        run: |
          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -x "$chrome"
          "$chrome" --version
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"
      - name: Browser smoke tests
        run: |
          python3 -m http.server 8000 > /tmp/riemann-server.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for i in {1..20}; do curl -fs http://127.0.0.1:8000/ >/dev/null && break; sleep 1; done
          node tests/browser.mjs
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: |
          mkdir _site
          cp index.html style.css app.mjs math.mjs _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
      - name: Wait for Pages artifact to become visible
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          for i in {1..30}; do
            count=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT_NAME" --jq '.total_count' || echo 0)
            if [[ "$count" =~ ^[1-9][0-9]*$ ]]; then
              echo "Pages artifact is visible"
              exit 0
            fi
            sleep 2
          done
          echo 'Pages artifact did not become visible within 60 seconds' >&2
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
