name: Test and publish
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: riemann-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
      - run: node --check app.mjs
      - run: npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
      - name: Locate preinstalled Chrome
        run: |
          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -x "$chrome"
          "$chrome" --version
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"
      - run: node build.mjs _site
      - name: Browser smoke tests
        run: |
          python3 -m http.server 8000 --directory _site > /tmp/riemann-server.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for i in {1..20}; do curl -fs http://127.0.0.1:8000/ >/dev/null && break; sleep 1; done
          node tests/browser.mjs
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: node build.mjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
      # deploy-pages@v4 uses the runner's internal artifact service, which
      # returned an empty list even when the REST API showed the uploaded file.
      # Use the same Pages deployment REST endpoint directly with the verified ID.
      - name: Deploy Pages via REST API
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          artifact_id=""
          for i in {1..30}; do
            artifact_id=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT_NAME" --jq '.artifacts[] | select(.expired == false) | .id' || true)
            if [[ "$artifact_id" =~ ^[0-9]+$ ]]; then break; fi
            sleep 2
          done
          [[ "$artifact_id" =~ ^[0-9]+$ ]] || { echo "Pages artifact not found"; exit 1; }
          echo "Publishing artifact $artifact_id from $GITHUB_SHA"
          oidc=$(curl --fail --silent --show-error -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -er .value)
          echo "::add-mask::$oidc"
          response=$(jq -n --argjson artifact "$artifact_id" --arg sha "$GITHUB_SHA" --arg token "$oidc" '{artifact_id:$artifact,pages_build_version:$sha,oidc_token:$token}' | gh api --method POST "/repos/$GITHUB_REPOSITORY/pages/deployments" --input -)
          unset oidc
          deployment_id=$(jq -r '.id // (.status_url | split("/") | last) // empty' <<< "$response")
          page_url=$(jq -r '.page_url // empty' <<< "$response")
          [[ -n "$deployment_id" ]] || { echo "No deployment ID returned"; exit 1; }
          echo "Deployment ID: $deployment_id"
          for i in {1..60}; do
            state=$(gh api "/repos/$GITHUB_REPOSITORY/pages/deployments/$deployment_id" --jq .status)
            echo "Pages status: $state"
            case "$state" in
              succeed)
                echo "page_url=$page_url" >> "$GITHUB_OUTPUT"
                exit 0 ;;
              deployment_failed|deployment_perms_error|deployment_content_failed|deployment_cancelled|deployment_lost)
                exit 1 ;;
            esac
            sleep 5
          done
          echo "Pages deployment timed out"
          gh api --method POST "/repos/$GITHUB_REPOSITORY/pages/deployments/$deployment_id/cancel" || true
          exit 1
